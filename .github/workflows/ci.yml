name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:release
      - run: npm run test
      - run: npm run build

  dependencies:
    name: Dependency security
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm audit --package-lock-only --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Rust dependency auditor
        shell: bash
        run: |
          if ! cargo audit --version 2>/dev/null | grep -Fxq 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [frontend, dependencies]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported glibc baseline, on each native CPU.
          - name: Linux x86_64
            os: ubuntu-22.04
            config: ''
          - name: Linux aarch64
            os: ubuntu-22.04-arm
            config: ''
          - name: macOS Apple Silicon
            os: macos-15
            config: ''
          - name: macOS Intel
            os: macos-15-intel
            config: ''
          - name: Windows x86_64
            os: windows-2022
            config: '--config src-tauri/tauri.windows.conf.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # CPU must be part of the key: both architectures use runner.os=macOS.
          key: ${{ matrix.os }}-${{ runner.arch }}-ci
      - uses: ./.github/actions/native-dependencies
      - run: npm ci
      - name: Check all Rust targets
        run: cargo check --locked --all-targets
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri
      - name: Tauri application build
        run: npm run tauri -- build --debug --no-bundle ${{ matrix.config }} -- --locked
