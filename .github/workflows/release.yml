name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immediately after all checks (otherwise create a draft)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  bundles:
    name: Bundle (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            config: ''
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            bundles: appimage,deb,rpm
            config: ''
          - platform: darwin-aarch64
            os: macos-15
            bundles: app,dmg
            config: ''
          - platform: darwin-x86_64
            os: macos-15-intel
            bundles: app,dmg
            config: ''
          - platform: windows-x86_64
            os: windows-2022
            bundles: nsis,msi
            config: '--config src-tauri/tauri.windows.conf.json'
    env:
      # Store the exact Tauri-generated key contents, without another base64 layer.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release configuration
        run: node scripts/release.mjs preflight
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.os }}-${{ runner.arch }}-release
      - uses: ./.github/actions/native-dependencies
      - run: npm ci
      - name: Build Linux and Windows bundles
        if: runner.os != 'macOS'
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.config }} -- --locked
      - name: Build signed and notarized macOS bundles
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: |
          node scripts/release.mjs apple-preflight
          npm run tauri -- build --bundles app,dmg -- --locked
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Hopper.app
          xcrun stapler validate src-tauri/target/release/bundle/macos/Hopper.app
          spctl --assess --type execute --verbose=2 src-tauri/target/release/bundle/macos/Hopper.app
      - name: Stage and verify signed artifacts
        run: node scripts/release.mjs stage ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: bundles
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify complete release and generate updater manifest
        id: metadata
        run: node scripts/release.mjs manifest
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          args=(--draft)
          if [ "$PUBLISH" = true ]; then args=(); fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hopper v$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "${args[@]}" \
            release-artifacts/*
