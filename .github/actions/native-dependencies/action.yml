name: Native build dependencies
description: Install the native dependencies shared by CI and release builds.
runs:
  using: composite
  steps:
    - name: Reproducible build timestamp
      shell: bash
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake clang libclang-dev pkg-config libssl-dev \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libasound2-dev patchelf libfuse2 xdg-utils rpm
    - name: macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: command -v cmake >/dev/null 2>&1 || brew install cmake
    - name: Windows dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install cmake llvm -y --no-progress
        "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
